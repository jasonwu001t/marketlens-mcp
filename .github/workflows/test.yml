name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - name: Test (no network, no secrets)
        env:
          MARKETLENS_CHECK_GENERATED: "1"
          PYTHONWARNDEFAULTENCODING: "1"   # with filterwarnings, an open() without encoding fails
        run: uv run --no-sync pytest      # tests/data is skipped: the data extra is not installed here

  data:
    # The data extra's tests, against marketlens-data from PyPI. Turned on by the
    # repository variable MARKETLENS_DATA_CI=on once marketlens-data is published.
    name: data extra / ubuntu-latest / Python 3.13
    if: vars.MARKETLENS_DATA_CI == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev,data]"
      - name: Test the data provider (no network, no secrets)
        env:
          OMNI_TEST_RUN: "1"
          PYTHONWARNDEFAULTENCODING: "1"
        run: uv run --no-sync pytest tests/data
